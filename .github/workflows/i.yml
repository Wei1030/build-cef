# This is a basic workflow to help you get started with Actions

name: Init

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
        clang_version:
            description: 'clang_version'
            required: false
            default: '19.1.7'
env:
  CLANG_VERSION: ${{ github.event.inputs.clang_version }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:   
  init-on-windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Cache CEF depot_tools
        id: cache_cef
        uses: actions/cache@v4
        with: 
          path: |
            automate
            depot_tools
          key: cef-depot_tools-${{ runner.os }}
          
      - name: Download CEF depot_tools
        if: steps.cache_cef.outputs.cache-hit != 'true'
        shell: cmd
        run: download.bat
        
      - name: Cache winsdksetup
        id: cache_winsdksetup
        uses: actions/cache@v4
        with: 
          path: |
            setup
          key: setup-${{ runner.os }}
          
      - name: Download winsdksetup
        if: steps.cache_winsdksetup.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
            mkdir .\setup
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2164145" -OutFile ".\setup\winsdksetup.exe"
            
      - name: Cache Clang
        id: cache_clang
        uses: actions/cache@v4
        with: 
          path: |
            LLVM_${{ env.CLANG_VERSION }}
          key: LLVM-${{ env.CLANG_VERSION }}-${{ runner.os }}
          
      - name: Install LLVM Clang
        if: steps.cache_clang.outputs.cache-hit != 'true'
        shell: powershell
        run: |
         Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_VERSION }}/LLVM-${{ env.CLANG_VERSION }}-win64.exe" -OutFile "llvm.exe"
         Start-Process -FilePath .\llvm.exe -ArgumentList "/S", "/D=${{ env.GITHUB_WORKSPACE }}\LLVM" -Wait
         Remove-Item ".\llvm.exe" -Force
        
             