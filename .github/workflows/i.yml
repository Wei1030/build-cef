# This is a basic workflow to help you get started with Actions

name: Init

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:   
  init-on-windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Cache CEF depot_tools
        id: cache_cef
        uses: actions/cache@v4
        with: 
          path: |
            automate
            depot_tools
          key: cef-depot_tools-${{ runner.os }}
          
      - name: Download CEF depot_tools
        if: steps.cache_cef.outputs.cache-hit != 'true'
        shell: cmd
        run: download.bat
        
      - name: Cache Installer
        id: cache_installer
        uses: actions/cache@v4
        with: 
          path: |
            installer
          key: installer-${{ runner.os }}
          
      - name: Download Installer
        if: steps.cache_installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
            mkdir .\installer
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2164145" -OutFile ".\installer\winsdksetup.exe"
            Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vs_community.exe" -OutFile ".\installer\vs_community.exe"
            