# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
        cef_branch: 
            description: 'cef_branch'
            required: false
            default: '5414'
  
env:
  CEF_BRANCH: ${{ github.event.inputs.cef_branch }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-on-windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Cache
        id: cache
        uses: actions/cache@v4
        with: 
          path: |
            automate
            depot_tools
          key: cef-depot_tools-${{ runner.os }}
          
      - name: Download Tool
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: download.bat
        
      - name: PrepareEnv
        shell: cmd
        run: prepare.bat ${{ env.CEF_BRANCH }}
        
      - name: Build
        shell: cmd
        run: build.bat
        
      - name: Package
        shell: cmd
        run: package.bat
        
      - name: Generate release tag
        id: tag
        shell: pwsh
        run: |
            $releaseTag = Get-Date -Format "yyyy.MM.dd-HHmm"
            echo "release_tag=${{ env.CEF_BRANCH }}_$releaseTag" >> $env:GITHUB_OUTPUT
            Set-Content -Path release.txt -Value "${{ env.CEF_BRANCH }} $releaseTag"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ./output/*
          
      - name: Delete workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: Remove old Releases
        if: always()
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
          