# Builds the custom CEF distribution for Windows, Linux and macOS.
#
# Kept as b.yml: workflow_dispatch needs a workflow file with the same name on
# the default branch, so this one can be run on any branch from the Actions UI
# or with `gh workflow run b.yml --ref <branch>`.

name: Build
run-name: Build ${{ inputs.cef_branch }}${{ inputs.attempt != '1' && format(' (continued, run {0})', inputs.attempt) || '' }}

on:
  workflow_dispatch:
    inputs:
      cef_branch:
        description: CEF branch
        required: false
        default: '5414'
      windows_x86:
        description: Build Windows x86 (32-bit)
        type: boolean
        default: true
      windows_x64:
        description: Build Windows x64 (64-bit)
        type: boolean
        default: true
      linux:
        description: Build Linux x64
        type: boolean
        default: true
      macos:
        description: Build macOS
        type: boolean
        default: true
      macos_arch:
        description: macOS architecture (x64 runs on the 4-core Intel runner, arm64 on the 3-core M1 runner)
        type: choice
        options: [x64, arm64]
        default: x64
      use_sccache:
        description: Cache compiler output with sccache in the Actions cache; builds that hit the 6 hour limit are then continued in a new run automatically
        type: boolean
        default: true
      release:
        description: Publish a GitHub release with the packages
        type: boolean
        default: true
      release_tag:
        description: Add the packages to this existing release instead of creating a new one (e.g. to complete a release whose macOS build failed)
        required: false
        default: ''
      attempt:
        description: Run number in a chain of continued runs (set by the workflow itself)
        required: false
        default: '1'

permissions:
  contents: write  # create releases
  actions: write   # delete old workflow runs

env:
  CEF_BRANCH: ${{ inputs.cef_branch }}
  # Appended to GN_DEFINES by setenv.bat / setenv.sh.
  EXTRA_GN_DEFINES: ${{ inputs.use_sccache && 'cc_wrapper=sccache' || '' }}
  # Lets sccache store its cache in the GitHub Actions cache.
  SCCACHE_GHA_ENABLED: ${{ inputs.use_sccache && 'true' || 'false' }}
  # sccache server log; the "sccache stats" step summarizes its errors (cache
  # write errors are only logged at debug level).
  SCCACHE_LOG: sccache::server=debug,sccache::cache=debug,opendal=warn
  SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache.log
  # A build job stops its Build step this many minutes after the job started
  # (the job limit is 360), leaving time to report and cache. With sccache, a
  # build stopped this way is continued by a new run, up to MAX_RUNS runs.
  BUILD_DEADLINE_MINUTES: 340
  MAX_RUNS: 5

jobs:
  windows:
    if: inputs.windows_x86 || inputs.windows_x64
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Only the architectures selected in the inputs.
        arch: ${{ fromJSON(format('[{0}{1}{2}]', inputs.windows_x86 && '"x86"' || '', (inputs.windows_x86 && inputs.windows_x64) && ',' || '', inputs.windows_x64 && '"x64"' || '')) }}
    env:
      CEF_ARCH: ${{ matrix.arch }}
      # Suffix of the package / time limit marker artifact names.
      PLATFORM_KEY: windows-${{ matrix.arch }}
    steps:
      - name: Record start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Disable autocrlf
        shell: cmd
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show machine info
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
          "Logical CPUs: $((Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors)"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -format text -property installationPath,installationVersion
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" | Select-Object -ExpandProperty Name

      - name: Cache depot_tools and automate
        id: cache_tools
        uses: actions/cache@v4
        with:
          path: |
            automate
            depot_tools
          key: tools-${{ runner.os }}-${{ hashFiles('download.bat', 'fix-automate-git.patch') }}

      - name: Download depot_tools and automate
        if: steps.cache_tools.outputs.cache-hit != 'true'
        shell: cmd
        run: download.bat

      - name: Set up sccache
        if: inputs.use_sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Retried: fetching from chromium.googlesource.com occasionally drops.
      - name: Prepare sources
        shell: cmd
        run: |
          set n=0
          :retry
          set /a n+=1
          call prepare.bat %CEF_BRANCH% && exit /b 0
          if %n% geq 3 exit /b 1
          echo ::warning::Prepare sources failed (attempt %n%), retrying
          ping -n 61 127.0.0.1 > nul
          goto retry

      # Some Blink binding objects reach exactly 260 characters (MAX_PATH)
      # under D:\a\build-cef\build-cef. clang-cl copes with that, but sccache
      # fails to write them on a cache hit, so configure, build and package
      # through a junction with a 20 characters shorter prefix.
      - name: Create short path
        shell: cmd
        run: mklink /J D:\w "%GITHUB_WORKSPACE%"

      - name: Create project
        shell: cmd
        working-directory: D:\w
        run: create_project.bat

      - name: Build time budget
        id: budget
        shell: bash
        run: ./ci-build-budget.sh

      # build-exit is only written when the build ends by itself, not when the
      # step is stopped at its time limit.
      - name: Build
        id: build
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: cmd
        working-directory: D:\w
        run: |
          call build.bat
          set rc=%errorlevel%
          echo %rc%> "%RUNNER_TEMP%\build-exit"
          exit /b %rc%

      - name: Check for time limit
        id: time_limit
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: ./ci-time-limit.sh

      - name: Upload time limit marker
        if: always() && steps.time_limit.outputs.reached == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timeout-${{ env.PLATFORM_KEY }}
          path: ${{ runner.temp }}/time-limit-marker
          retention-days: 3

      - name: sccache stats
        if: always() && inputs.use_sccache
        shell: bash
        run: ./sccache-stats.sh

      - name: Package
        shell: cmd
        working-directory: D:\w
        run: package.bat

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cef-windows-${{ matrix.arch }}
          path: output/*.zip
          retention-days: 3
          compression-level: 0

  linux:
    if: inputs.linux
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CEF_ARCH: x64
      PLATFORM_KEY: linux-x64
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          df -h / /mnt || true
          # Toolchains this build does not need (~30GB).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
                      /usr/share/swift /usr/local/julia* /opt/microsoft || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt || true
          echo "Logical CPUs: $(nproc)"; free -g

      - name: Checkout
        uses: actions/checkout@v4

      - name: Put chromium_git on the larger disk
        run: |
          # GitHub-hosted Linux runners have a separate temporary disk at /mnt.
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          mnt_free=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc '0-9' || true)
          echo "free: / ${root_free}G, /mnt ${mnt_free:-0}G"
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/chromium_git
            sudo chown "$(id -u):$(id -g)" /mnt/chromium_git
            ln -s /mnt/chromium_git chromium_git
            echo "chromium_git -> /mnt/chromium_git"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache depot_tools and automate
        id: cache_tools
        uses: actions/cache@v4
        with:
          path: |
            automate
            depot_tools
          key: tools-${{ runner.os }}-${{ hashFiles('download.sh', 'fix-automate-git.patch') }}

      - name: Download depot_tools and automate
        if: steps.cache_tools.outputs.cache-hit != 'true'
        run: ./download.sh

      - name: Set up sccache
        if: inputs.use_sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Retried: fetching from chromium.googlesource.com occasionally drops.
      - name: Prepare sources
        run: |
          for i in 1 2 3; do
            ./prepare.sh "$CEF_BRANCH" && exit 0
            echo "::warning::Prepare sources failed (attempt $i)"
            sleep 60
          done
          exit 1

      - name: Install build dependencies
        run: |
          sudo ./chromium_git/chromium/src/build/install-build-deps.sh \
            --no-prompt --no-arm --no-chromeos-fonts --no-nacl --no-syms
          df -h / /mnt || true

      - name: Create project
        run: ./create_project.sh

      - name: Build time budget
        id: budget
        run: ./ci-build-budget.sh

      # build-exit is only written when the build ends by itself, not when the
      # step is stopped at its time limit.
      - name: Build
        id: build
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        run: |
          rc=0; ./build.sh || rc=$?
          echo "$rc" > "$RUNNER_TEMP/build-exit"
          exit "$rc"

      - name: Check for time limit
        id: time_limit
        if: always() && steps.build.outcome == 'failure'
        run: ./ci-time-limit.sh

      - name: Upload time limit marker
        if: always() && steps.time_limit.outputs.reached == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timeout-${{ env.PLATFORM_KEY }}
          path: ${{ runner.temp }}/time-limit-marker
          retention-days: 3

      - name: sccache stats
        if: always() && inputs.use_sccache
        run: ./sccache-stats.sh

      - name: Package
        run: ./package.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cef-linux-x64
          path: output/*.tar.bz2
          retention-days: 3
          compression-level: 0

  macos:
    if: inputs.macos
    name: macOS ${{ inputs.macos_arch }}
    runs-on: ${{ inputs.macos_arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 360
    env:
      CEF_ARCH: ${{ inputs.macos_arch }}
      PLATFORM_KEY: macos-${{ inputs.macos_arch }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          df -h /
          echo "Logical CPUs: $(sysctl -n hw.ncpu), RAM: $(( $(sysctl -n hw.memsize) / 1073741824 ))GB"
          xcodebuild -version
          current="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          echo "Selected Xcode: $current"
          # Remove the other Xcode versions (tens of GB).
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$current" ] && continue
            [ -L "$x" ] && continue
            echo "Removing $x"; sudo rm -rf "$x"
          done
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download macOS 13.0 SDK
        run: |
          # Chromium 109 was built with the 13.0 SDK; its clang 16 fails on the
          # Foundation / Security headers of the SDK in the runner's Xcode.
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.xz" \
            https://github.com/joseluisq/macosx-sdks/releases/download/13.0/MacOSX13.0.sdk.tar.xz
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/sdk.tar.xz"
          sdk="$RUNNER_TEMP/MacOSX13.sdk"
          test -f "$sdk/SDKSettings.json"
          echo "MAC_SDK_PATH=$sdk" >> "$GITHUB_ENV"

      - name: Cache depot_tools and automate
        id: cache_tools
        uses: actions/cache@v4
        with:
          path: |
            automate
            depot_tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('download.sh', 'fix-automate-git.patch') }}

      - name: Download depot_tools and automate
        if: steps.cache_tools.outputs.cache-hit != 'true'
        run: ./download.sh

      - name: Set up sccache
        if: inputs.use_sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Retried: fetching from chromium.googlesource.com occasionally drops.
      - name: Prepare sources
        run: |
          for i in 1 2 3; do
            ./prepare.sh "$CEF_BRANCH" && exit 0
            echo "::warning::Prepare sources failed (attempt $i)"
            sleep 60
          done
          exit 1

      - name: Create project
        run: ./create_project.sh

      - name: Build time budget
        id: budget
        run: ./ci-build-budget.sh

      # build-exit is only written when the build ends by itself, not when the
      # step is stopped at its time limit.
      - name: Build
        id: build
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        run: |
          rc=0; ./build.sh || rc=$?
          echo "$rc" > "$RUNNER_TEMP/build-exit"
          exit "$rc"

      - name: Check for time limit
        id: time_limit
        if: always() && steps.build.outcome == 'failure'
        run: ./ci-time-limit.sh

      - name: Upload time limit marker
        if: always() && steps.time_limit.outputs.reached == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timeout-${{ env.PLATFORM_KEY }}
          path: ${{ runner.temp }}/time-limit-marker
          retention-days: 3

      - name: sccache stats
        if: always() && inputs.use_sccache
        run: ./sccache-stats.sh

      - name: Package
        run: ./package.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cef-macos-${{ inputs.macos_arch }}
          path: output/*.tar.bz2
          retention-days: 3
          compression-level: 0

  release:
    name: Publish release
    needs: [windows, linux, macos]
    if: always() && inputs.release
    runs-on: ubuntu-latest
    outputs:
      # Set when the packages were published.
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      # Each artifact goes to dist/<name>: cef-<platform> with the packages,
      # timeout-<platform> for a build stopped at its time limit.
      - name: Download packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist

      - name: Generate release tag and notes
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ls -laR dist 2>/dev/null || true
          built=$(ls -d dist/cef-* 2>/dev/null | sed 's|^dist/cef-||' || true)
          stopped=$(ls -d dist/timeout-* 2>/dev/null | sed 's|^dist/timeout-||' || true)
          if [ -z "$built" ]; then
            echo "No packages to publish"
            exit 0
          fi
          tag="${RELEASE_TAG:-${CEF_BRANCH}_$(date -u +%Y.%m.%d-%H%M)}"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "built=$(echo $built)" >> "$GITHUB_OUTPUT"
          {
            if [ -z "$RELEASE_TAG" ]; then
              echo "CEF ${CEF_BRANCH} custom build (${GITHUB_SHA::7})"
              echo
            fi
            for p in $built; do echo "- $p (${GITHUB_SHA::7})"; done
            for p in $stopped; do echo "- $p: time limit reached, continued in the next run"; done
          } > release.txt
          cat release.txt

      - name: Upload to release
        if: steps.tag.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.release_tag }}
          BUILT: ${{ steps.tag.outputs.built }}
          NEW_RELEASE: ${{ inputs.release_tag == '' }}
        run: |
          files=$(ls dist/cef-*/*.zip dist/cef-*/*.tar.bz2 2>/dev/null)
          if [ "$NEW_RELEASE" = true ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"               --title "$TAG" --notes-file release.txt $files
            exit 0
          fi
          # An existing release only gets the files and notes: moving it to
          # another commit is refused to the workflow token when the commits
          # differ in workflow files.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
          # Append the notes, dropping the time limit lines of the platforms
          # built now.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body             | grep -vE "^- ($(echo $BUILT | tr ' ' '|')): time limit reached" > notes.txt || true
          cat release.txt >> notes.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.txt > /dev/null
          cat notes.txt

  # Starts a new run for the builds that stopped at their time limit; with
  # sccache it continues from the objects this run compiled.
  continue:
    name: Continue unfinished builds
    needs: [windows, linux, macos, release]
    if: always() && !cancelled() && inputs.use_sccache
    runs-on: ubuntu-latest
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt }}
          # The release this run published to, so the next run adds to it.
          RELEASE_TAG: ${{ needs.release.outputs.release_tag || inputs.release_tag }}
          RELEASE: ${{ inputs.release }}
          MACOS_ARCH: ${{ inputs.macos_arch }}
          WINDOWS_X86: ${{ inputs.windows_x86 }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          LINUX: ${{ inputs.linux }}
          MACOS: ${{ inputs.macos }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name')
          # A requested build without a package is continued when it stopped at
          # its time limit, or its job was cancelled (the 6 hour job limit).
          next() {
            if [ "$1" = true ] && ! grep -qx "cef-$2" <<< "$names" &&
               { grep -qx "timeout-$2" <<< "$names" || [ "$3" = cancelled ]; }; then
              echo true
            else
              echo false
            fi
          }
          x86=$(next "$WINDOWS_X86" windows-x86 "$WINDOWS_RESULT")
          x64=$(next "$WINDOWS_X64" windows-x64 "$WINDOWS_RESULT")
          linux=$(next "$LINUX" linux-x64 "$LINUX_RESULT")
          macos=$(next "$MACOS" "macos-$MACOS_ARCH" "$MACOS_RESULT")
          echo "Unfinished: windows_x86=$x86 windows_x64=$x64 linux=$linux macos=$macos"
          if [ "$x86$x64$linux$macos" = falsefalsefalsefalse ]; then
            exit 0
          fi
          if [ "$ATTEMPT" -ge "$MAX_RUNS" ]; then
            echo "::error::Builds still unfinished after $MAX_RUNS runs"
            exit 1
          fi
          gh workflow run b.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"             -f cef_branch="$CEF_BRANCH"             -f windows_x86="$x86" -f windows_x64="$x64" -f linux="$linux"             -f macos="$macos" -f macos_arch="$MACOS_ARCH"             -f use_sccache=true -f release="$RELEASE" -f release_tag="$RELEASE_TAG"             -f attempt="$((ATTEMPT + 1))"
          echo "::notice::Started run $((ATTEMPT + 1)) of at most $MAX_RUNS for the unfinished builds"

  cleanup:
    name: Clean up old runs and releases
    needs: [release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 10

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          keep_latest: 3
          delete_tags: true
