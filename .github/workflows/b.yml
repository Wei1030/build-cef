# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
        cef_branch: 
            description: 'cef_branch'
            required: false
            default: '5414'
        clang_version:
            description: 'clang_version'
            required: false
            default: '19.1.7'
  
env:
  CEF_BRANCH: ${{ github.event.inputs.cef_branch }}
  CLANG_VERSION: ${{ github.event.inputs.clang_version }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-on-windows:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Cache CEF depot_tools
        id: cache_cef
        uses: actions/cache@v4
        with: 
          path: |
            automate
            depot_tools
          key: cef-depot_tools-${{ runner.os }}
          
      - name: Download CEF depot_tools
        if: steps.cache_cef.outputs.cache-hit != 'true'
        shell: cmd
        run: download.bat
        
      - name: Cache winsdksetup
        id: cache_winsdksetup
        uses: actions/cache@v4
        with: 
          path: |
            setup
          key: setup-${{ runner.os }}
          
      - name: Download winsdksetup
        if: steps.cache_winsdksetup.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
            mkdir .\setup
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2164145" -OutFile ".\setup\winsdksetup.exe"
        
      - name: Install WinSDK with Debugging Tools
        shell: pwsh
        run: |
            Start-Process -FilePath ".\setup\winsdksetup.exe" -ArgumentList "/quiet /norestart /ceip off /features OptionId.WindowsDesktopDebuggers OptionId.DesktopCPPx86 OptionId.DesktopCPPx64" -Wait
      
      - name: Cache Clang
        id: cache_clang
        uses: actions/cache@v4
        with: 
          path: |
            LLVM
          key: LLVM-${{ env.CLANG_VERSION }}-${{ runner.os }}
          
      - name: Install LLVM Clang
        if: steps.cache_clang.outputs.cache-hit != 'true'
        shell: powershell
        run: |
         Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_VERSION }}/LLVM-${{ env.CLANG_VERSION }}-win64.exe" -OutFile "llvm.exe"
         Start-Process -FilePath .\llvm.exe -ArgumentList "/S", "/D=${{ github.workspace }}\LLVM" -Wait
         Remove-Item ".\llvm.exe" -Force
        
      - name: PrepareEnv
        shell: cmd
        run: prepare.bat ${{ env.CEF_BRANCH }}
        
      - name: Create Project
        shell: cmd
        run: create_project.bat
        
      - name: Build
        shell: cmd
        run: build.bat
        
      - name: Package
        shell: cmd
        run: package.bat
        
      - name: Generate release tag
        id: tag
        shell: pwsh
        run: |
            $releaseTag = Get-Date -Format "yyyy.MM.dd-HHmm"
            echo "release_tag=${{ env.CEF_BRANCH }}_$releaseTag" >> $env:GITHUB_OUTPUT
            Set-Content -Path release.txt -Value "${{ env.CEF_BRANCH }} $releaseTag"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ./output/*
          
      - name: Delete workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3

      - name: Remove old Releases
        if: always()
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
          